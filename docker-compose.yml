# Americana Earn - postgres+redis always run; api/web/caddy/backup are in the "app" profile.
#   Local development: docker compose up -d postgres redis (run api/web with pnpm)
#   Full stack:        docker compose --profile app up -d --build (Caddy :80/:443)
# Settings are read from .env (DOMAIN, JWT_ACCESS_SECRET, PUBLIC_ORIGIN, SMTP_*).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:17
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refearn}
      POSTGRES_DB: ${POSTGRES_DB:-refearn}
    ports:
      # 5432/6379 are often used by other local projects, so this stack uses 5434/6380.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-refearn} -d ${POSTGRES_DB:-refearn}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    logging: *default-logging
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    profiles: ["app"]
    logging: *default-logging
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-refearn}:${POSTGRES_PASSWORD:-refearn}@postgres:5432/${POSTGRES_DB:-refearn}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set in .env}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      WEB_URL: ${PUBLIC_ORIGIN:-http://localhost}
      APP_NAME: ${APP_NAME:-Americana Earn}
      APP_MONOGRAM: ${APP_MONOGRAM:-A}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-tenant_owner,tenant_admin,platform_admin}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      BACKUP_DIR: /backups
      BACKUP_PREFIX: ${BACKUP_PREFIX:-americana_earn}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MIN_KEEP: ${BACKUP_MIN_KEEP:-3}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
      BACKUP_ALERT_CMD: ${BACKUP_ALERT_CMD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Americana Earn <no-reply@americana-earn.local>}
    volumes:
      - backups:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    profiles: ["app"]
    logging: *default-logging
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser calls /v1 from the same origin through Caddy, so no CORS is needed.
        NEXT_PUBLIC_API_URL: /v1
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-${APP_NAME:-Americana Earn}}
        NEXT_PUBLIC_APP_MONOGRAM: ${NEXT_PUBLIC_APP_MONOGRAM:-${APP_MONOGRAM:-A}}
    environment:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-${APP_NAME:-Americana Earn}}
      NEXT_PUBLIC_APP_MONOGRAM: ${NEXT_PUBLIC_APP_MONOGRAM:-${APP_MONOGRAM:-A}}
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    profiles: ["app"]
    image: caddy:2
    logging: *default-logging
    environment:
      # Empty means ":80" for local HTTP. A real domain enables automatic HTTPS.
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

  backup:
    profiles: ["app"]
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-refearn}:${POSTGRES_PASSWORD:-refearn}@postgres:5432/${POSTGRES_DB:-refearn}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-americana_earn}
      BACKUP_MIN_KEEP: ${BACKUP_MIN_KEEP:-3}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # age public key. When set, backups are encrypted before offsite copy.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # Offsite copy command; $1 = backup file path, for example rclone copyto "$1" gdrive:
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
      BACKUP_OFFSITE_RETENTION_CMD: ${BACKUP_OFFSITE_RETENTION_CMD:-}
      BACKUP_ALERT_CMD: ${BACKUP_ALERT_CMD:-}
      BACKUP_MAX_AGE_MINUTES: ${BACKUP_MAX_AGE_MINUTES:-1800}
      # rclone Google Drive remote via environment variables; no rclone.conf is required.
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE: /secrets/gdrive.json
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${GDRIVE_FOLDER_ID:-}
      # Optional private age key path for restore-test.
      AGE_IDENTITY_FILE: ${AGE_IDENTITY_FILE:-/secrets/age.key}
    volumes:
      - backups:/backups
      - ./docker/backup/secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -type f \\( -name \"$${BACKUP_PREFIX:-americana_earn}_*.sql.gz\" -o -name \"$${BACKUP_PREFIX:-americana_earn}_*.sql.gz.age\" \\) -mmin -$${BACKUP_MAX_AGE_MINUTES:-1800} | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  backups:
